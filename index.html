<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KuloKiLegge</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #222;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      transition: background-image 0.5s ease-in-out;
    }

    .buttons-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 1000;
    }

    .buttons-container button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,0.8);
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .buttons-container button:hover {
      background: rgba(0,0,0,0.8);
      color: white;
    }

    .buttons-container button.active {
      background: rgba(0,0,0,0.9);
      color: white;
    }

    .custom-player {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
    }

    #playPauseBtn {
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 50%;
      padding: 12px;
      font-size: 20px;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    #playPauseBtn:hover {
      background: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="buttons-container">
    <button data-bg="bg1" class="active">Sfondo 1</button>
    <button data-bg="bg2">Sfondo 2</button>
    <button data-bg="bg3">Eeepy</button>
    <button data-bg="bg4">Sfondo 4</button>
  </div>

  <!-- Player custom -->
  <div class="custom-player">
    <button id="playPauseBtn"><i class="fas fa-play"></i></button>
  </div>

  <!-- Audio tracks (una per ogni sfondo) -->
  <audio id="audio-bg1" src="https://github.com/Crymoreaboutit1/Crymoreaboutit1.github.io/raw/main/diver.mp3" loop></audio>
  <audio id="audio-bg2" src="https://github.com/Crymoreaboutit1/Crymoreaboutit1.github.io/raw/main/Mononoke.mp3" loop></audio>
  <audio id="audio-bg3" src="https://github.com/Crymoreaboutit1/Crymoreaboutit1.github.io/raw/main/Bleach.mp3" loop></audio>
  <audio id="audio-bg4" src="https://github.com/Crymoreaboutit1/Crymoreaboutit1.github.io/raw/main/song4.mp3" loop></audio>

  <script>
    const backgrounds = {
      bg1: 'https://xatimg.com/image/MFxUl9SBfs6s.gif',
      bg2: 'https://xatimg.com/image/hGwZ3BYG7Hjl.png',
      bg3: 'https://xatimg.com/image/ikuSQk3oNX30.jpg',
      bg4: 'https://xatimg.com/image/y5YJDHCtfOUO.png',
    };

    const buttons = document.querySelectorAll('.buttons-container button');
    const audioElements = {
      bg1: document.getElementById('audio-bg1'),
      bg2: document.getElementById('audio-bg2'),
      bg3: document.getElementById('audio-bg3'),
      bg4: document.getElementById('audio-bg4'),
    };

    let currentBg = 'bg1';
    let currentAudio = audioElements[currentBg];

    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = playPauseBtn.querySelector('i');

    function setBackground(key) {
      document.body.style.backgroundImage = `url('${backgrounds[key]}')`;

      buttons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.bg === key);
      });

      if (currentAudio && !currentAudio.paused) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      currentBg = key;
      currentAudio = audioElements[currentBg];
      playIcon.classList.replace('fa-pause', 'fa-play');
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        setBackground(btn.dataset.bg);
      });
    });

    playPauseBtn.addEventListener('click', () => {
      if (currentAudio.paused) {
        currentAudio.play();
        playIcon.classList.replace('fa-play', 'fa-pause');
      } else {
        currentAudio.pause();
        playIcon.classList.replace('fa-pause', 'fa-play');
      }
    });

    // Imposta iniziale
    setBackground('bg1');
  </script>
</body>
</html>
